app-id: io.github.parvaz.ParvazPlayer
# Qt 6 lives in the KDE runtime, NOT in org.freedesktop.Platform — a Qt6 app
# built against the freedesktop runtime finds no Qt at configure time.
# org.kde.Platform 6.8 tracks Qt 6.8 (>= our 6.5 floor) on the 24.08 base.
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: parvaz

finish-args:
  # Display & Windowing
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Audio & Video Acceleration
  - --socket=pulseaudio
  - --device=dri

  # Network (Streaming URLs & Subtitle Search)
  - --share=network

  # File Access (Media libraries & Direct playback)
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
  - --filesystem=host:ro

  # D-Bus integration
  - --own-name=org.mpris.MediaPlayer2.parvaz
  - --talk-name=org.mpris.MediaPlayer2.*
  - --talk-name=org.freedesktop.ScreenSaver

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg

modules:
  # tomlplusplus is vendored in 3rdparty/ (single header) — no module needed.
  # mpv's meson.build declares libplacebo as a REQUIRED dependency and links
  # it statically; the KDE runtime ships the ffmpeg/libass stack but not
  # libplacebo, so it must be built here. Static matching mpv's request.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddefault_library=static
      # Fedora-based SDKs default libdir to lib64, but pkg-config in the
      # flatpak build env only searches /app/lib/pkgconfig — without this
      # mpv's dependency('libplacebo') lookup fails.
      - -Dlibdir=lib
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.349.0

  # mpv's meson.build also declares libass (>= 0.12.2) as a required
  # dependency; the KDE runtime does not ship it either. It links shared,
  # so it is bundled into the app at runtime for subtitle rendering.
  - name: libass
    buildsystem: meson
    config-opts:
      # Same reason as libplacebo: the Fedora-based SDK defaults libdir to
      # lib64, which pkg-config in the flatpak build env does not search.
      - -Dlibdir=lib
      # NOTE: no other options — libass's meson has no "tests" option and
      # its defaults (harfbuzz/fribidi/freetype/fontconfig) resolve from the
      # KDE runtime.
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.4

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dmanpage-build=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.39.0

  - name: parvaz
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: dir
        path: ..
