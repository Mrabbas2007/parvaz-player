app-id: io.github.parvaz.ParvazPlayer
# Qt 6 lives in the KDE runtime, NOT in org.freedesktop.Platform — a Qt6 app
# built against the freedesktop runtime finds no Qt at configure time.
# org.kde.Platform 6.8 tracks Qt 6.8 (>= our 6.5 floor) on the 24.08 base.
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: parvaz

finish-args:
  # Display & Windowing
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Audio & Video Acceleration
  - --socket=pulseaudio
  - --device=dri

  # Network (Streaming URLs & Subtitle Search)
  - --share=network

  # File Access (Media libraries & Direct playback)
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
  - --filesystem=host:ro

  # D-Bus integration
  - --own-name=org.mpris.MediaPlayer2.parvaz
  - --talk-name=org.mpris.MediaPlayer2.*
  - --talk-name=org.freedesktop.ScreenSaver

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: .

cleanup-commands:
  - mkdir -p ${FLATPAK_DEST}/lib/ffmpeg

modules:
  # tomlplusplus is vendored in 3rdparty/ (single header) — no module needed.
  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dmanpage-build=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.39.0

  - name: parvaz
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: dir
        path: ..
