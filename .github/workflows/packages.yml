# Native distro packages: Arch (PKGBUILD), Fedora (RPM), Ubuntu 25.04 (DEB)
# and a universal Flatpak bundle — built in the real distro containers and
# attached to the release of the pushed tag.
#
# Runs ONLY on v* tags and manual dispatch: this repo is private, so every
# job burns Actions minutes from the monthly quota.

name: Distro Packages

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version used in artifact names, taken from the pushed tag (v0.1.1).
  # Manual dispatch builds get a neutral placeholder — the publish job only
  # runs on tag refs, so the placeholder never reaches a release.
  APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0' }}

jobs:
  arch:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build and test dependencies
        run: |
          pacman -Syu --noconfirm \
            git cmake ninja qt6-base qt6-declarative mpv ffmpeg unzip \
            xorg-server-xvfb

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build

      - name: Smoke test
        run: xvfb-run -a ninja -C build check

      - name: Build package
        run: |
          # The workspace is mounted with a different uid inside the container;
          # without this git refuses every operation ("dubious ownership").
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="${APP_VERSION#v}"
          git archive --prefix=parvaz-$VERSION/ HEAD -o packaging/arch/parvaz-$VERSION.tar.gz
          # Keep the PKGBUILD version in lockstep with the tag being built:
          # the source tarball name and the built package version must match.
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          # makepkg refuses to run as root — build under a regular user.
          useradd -m builder
          chown -R builder:builder .
          # makepkg's --nodebug option was removed in pacman 7.1 (rolling
          # base-devel image); debug output is disabled explicitly via the
          # options=(!debug) array in the PKGBUILD instead.
          runuser -u builder -- bash -c "cd packaging/arch && makepkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-arch
          path: packaging/arch/parvaz-[0-9]*.pkg.tar.zst
          if-no-files-found: error

  fedora:
    name: Fedora (RPM)
    runs-on: ubuntu-24.04
    # Pinned to a mature release: :latest tracks the freshest Fedora where
    # RPM Fusion has not caught up yet (ffmpeg deps unresolvable).
    container: fedora:43
    steps:
      - name: Install build and test dependencies
        run: |
          # mpv-libs and ffmpeg live in RPM Fusion, not in the Fedora base
          # repos — the fusion release repo must be added BEFORE the install
          # transaction or dnf fails to resolve mpv-libs-devel.
          dnf install -y "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
          dnf install -y git cmake ninja-build gcc-c++ \
            qt6-qtbase-devel qt6-qtdeclarative-devel mpv-libs-devel \
            rpm-build unzip mesa-libGL-devel xorg-x11-server-Xvfb ffmpeg

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -Dparvaz_packaging=ON
          cmake --build build

      - name: Smoke test
        run: xvfb-run -a ninja -C build check

      # cpack writes into its working directory, so run it from build/ —
      # running it from the repo root put the RPMs outside the upload glob.
      - name: Package (CPack RPM)
        run: cd build && cpack -G RPM

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-fedora
          path: build/*.rpm
          if-no-files-found: error

  deb:
    name: Ubuntu 25.04 (DEB)
    runs-on: ubuntu-24.04
    container: ubuntu:25.04
    steps:
      - name: Install build and test dependencies
        run: |
          apt-get update
          # Qt 6.8 ships here (24.04 has 6.4, below our >= 6.5 floor).
          # Qt6QuickControls2 dev files are part of qt6-declarative-dev.
          apt-get install -y git cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev libmpv-dev dpkg-dev ffmpeg unzip \
            libgl-dev xvfb desktop-file-utils appstream

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -Dparvaz_packaging=ON
          cmake --build build

      - name: Smoke test
        run: xvfb-run -a ninja -C build check

      - name: Package (CPack DEB)
        run: cd build && cpack -G DEB

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: build/*.deb
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Install runtimes
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Qt 6 lives in the KDE runtime (org.freedesktop.Platform has none).
          flatpak install -y --noninteractive --user flathub \
            org.kde.Platform/x86_64/6.8 org.kde.Sdk/x86_64/6.8 \
            org.freedesktop.Platform.ffmpeg-full/x86_64/24.08

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          flatpak-builder --user --repo=repo --force-clean \
            --default-branch=stable build-dir \
            flatpak/io.github.parvaz.ParvazPlayer.yml

      - name: Create bundle
        run: |
          # The builder committed under --default-branch=stable; build-bundle
          # looks for "master" unless the branch is given explicitly.
          VERSION="${APP_VERSION#v}"
          flatpak build-bundle repo "parvaz-$VERSION-x86_64.flatpak" \
            io.github.parvaz.ParvazPlayer stable

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-flatpak
          path: parvaz-[0-9]*-x86_64.flatpak
          if-no-files-found: error

  windows:
    name: Windows x64 (Setup & Portable)
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        run: |
          python3 -m pip install --user aqtinstall
          python3 -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:USERPROFILE\Qt"
          echo "CMAKE_PREFIX_PATH=$env:USERPROFILE\Qt\6.8.3\msvc2022_64;$env:USERPROFILE\mpv-dev" >> $env:GITHUB_ENV
          echo "$env:USERPROFILE\Qt\6.8.3\msvc2022_64\bin" >> $env:GITHUB_PATH
          echo "$env:USERPROFILE\mpv-dev" >> $env:GITHUB_PATH

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Inno Setup and FFmpeg
        run: choco install -y innosetup ffmpeg

      - name: Download libmpv development files
        shell: pwsh
        run: |
          mkdir "$env:USERPROFILE\mpv-download"
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-*.7z" --dir "$env:USERPROFILE\mpv-download"
          $archive = Get-ChildItem -Path "$env:USERPROFILE\mpv-download" -Filter "mpv-dev-x86_64-*.7z" | Select-Object -First 1
          7z x $archive.FullName -o"$env:USERPROFILE\mpv-dev" -y
          Push-Location "$env:USERPROFILE\mpv-dev"
          $exports = & dumpbin /exports libmpv-2.dll
          $symbols = $exports | Where-Object { $_ -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)" } | ForEach-Object { $matches[1] }
          @("LIBRARY libmpv-2.dll", "EXPORTS") + $symbols | Out-File -Encoding ascii mpv.def
          & lib /def:mpv.def /out:mpv.lib /machine:x64
          Get-ChildItem
          Pop-Location
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$env:USERPROFILE\Qt\6.8.3\msvc2022_64;$env:USERPROFILE\mpv-dev" -DMPV_ROOT="$env:USERPROFILE\mpv-dev"

      - name: Build Project
        run: cmake --build build --config RelWithDebInfo

      - name: Package Windows Artifacts (Portable ZIP + Inno Setup)
        shell: pwsh
        run: |
          $version = $env:APP_VERSION -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist
          # 1. Create Portable ZIP
          Compress-Archive -Path build\release\* -DestinationPath "dist\parvaz-$version-windows-x64-portable.zip" -CompressionLevel Optimal
          # 2. Compile Inno Setup Installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss "/DAppVersion=$version" /DSourceDir=..\..\build\release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach packages to release
    needs: [arch, fedora, deb, flatpak, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The upload target must be an existing release. When a tag is pushed
          # without a pre-created release, make a stub with generated notes
          # (the maintainer can rewrite the notes afterwards).
          gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" \
              --title "Parvaz Player ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber \
            --repo "${{ github.repository }}"
