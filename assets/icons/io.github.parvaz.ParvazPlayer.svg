<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A22" />
      <stop offset="50%" stop-color="#0E1017" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8A2BE2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>

    <!-- Flight Wing Gradient 1 (Cyan to Blue) -->
    <linearGradient id="wingGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Flight Wing Gradient 2 (Violet to Purple) -->
    <linearGradient id="wingGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <!-- Core Wing / Play Arrow Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient Wing Glow -->
  <g opacity="0.35" filter="url(#glow)">
    <path d="M150 130 L380 256 L150 382 Z" fill="#00F0FF" />
  </g>

  <!-- Aerodynamic Feather Layer 1 (Upper Outer Wing) -->
  <path d="M140 120 C 180 120, 290 190, 360 256 C 280 230, 200 200, 140 180 Z"
        fill="url(#wingGrad1)" opacity="0.9" />

  <!-- Aerodynamic Feather Layer 2 (Lower Outer Wing) -->
  <path d="M140 392 C 180 392, 290 322, 360 256 C 280 282, 200 312, 140 332 Z"
        fill="url(#wingGrad2)" opacity="0.85" />

  <!-- Main Speed Wing / Supersonic Play Falcon (Center Forward Dart) -->
  <path d="M168 152 C 210 180, 340 238, 386 256 C 340 274, 210 332, 168 360 C 184 310, 204 274, 210 256 C 204 238, 184 202, 168 152 Z"
        fill="url(#playGrad)" />

  <!-- Center Accent Turbine Glow -->
  <circle cx="210" cy="256" r="14" fill="#00F0FF" opacity="0.9" />
  <circle cx="210" cy="256" r="6" fill="#FFFFFF" />
</svg>
